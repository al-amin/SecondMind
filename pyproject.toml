[project]
name = "secondmind"
version = "0.1.0"
description = "Portable, cross-session AI memory. Zero required dependencies. One memory. Every AI. Any machine."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.2"]

[project.scripts]
secondmind = "secondmind.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["secondmind*", "secondmind_mcp*"]
