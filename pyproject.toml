[project]
name = "secondmind"
version = "0.1.0"
description = "Portable, cross-session AI memory. Zero required dependencies. One memory. Every AI. Any machine."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
# v2: ported to the mcp 2.0.0 API (SPEC.md section 10) — the low-level
# Server's on_list_tools/on_call_tool constructor kwargs, MCPError's new
# signature, and the CallToolResult(is_error=True) exception-handling
# contract. Verified against a real mcp==2.0.0 install (see ROADMAP.md
# item 1); the v1 tag/main branch stays pinned to the pre-2.0 line.
mcp = ["mcp>=2.0"]
# v2: optional real-ML embedder (ROADMAP.md item 4). Never installed by
# default and never required — secondmind.semantic_embedder imports
# sentence_transformers lazily inside a try/except, so the core always
# imports cleanly with this extra absent. Opt in with
# SECONDMIND_EMBEDDER=semantic once installed; falls back silently to
# HashingEmbedder if the extra is missing or the model fails to load.
semantic = ["sentence-transformers>=2.2"]

[project.scripts]
secondmind = "secondmind.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["secondmind*", "secondmind_mcp*"]
