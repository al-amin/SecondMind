[project]
name = "secondmind"
version = "0.1.0"
description = "Portable, cross-session AI memory. Zero required dependencies. One memory. Every AI. Any machine."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
# Pinned to the 1.x line the adapter was built and live-probed against.
# mcp 2.0.0 is a breaking rewrite of the low-level server API (Server no
# longer exposes list_tools()/call_tool() decorators or a matching
# run(read_stream, write_stream, ...) signature — it's a different shape
# entirely, likely built around Streamable HTTP as the default transport).
# Porting secondmind_mcp/server.py to that API is real, deliberate future
# work, not a version-string bump — see the v2 roadmap in README.md.
mcp = ["mcp>=1.2,<2.0"]

[project.scripts]
secondmind = "secondmind.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["secondmind*", "secondmind_mcp*"]
