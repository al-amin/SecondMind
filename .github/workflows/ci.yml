name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Installed before any test step runs: `unittest discover` imports
      # every tests/*.py file up front, including test_mcp_adapter.py,
      # which imports `mcp` at module level. Running discover before this
      # install broke on real (non-macOS-dev-machine) runners where `mcp`
      # isn't already present system-wide — the separate core-isolation
      # job below is the dedicated, correct place that proves the core
      # itself needs no installs; this job's job is the real-OS launcher
      # and live-probe checks.
      - name: Install mcp SDK extra
        run: python -m pip install -e ".[mcp]"

      - name: Run full test suite
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v > test-output.log 2>&1
          exit_code=$?
          cat test-output.log
          if [ $exit_code -ne 0 ]; then
            # Surface only the actual failure/error text as annotations —
            # job logs require repo admin rights to download via the API,
            # but annotations don't, and GitHub caps how many surface per
            # job, so a targeted grep (not a blind tail) is what actually
            # gets the useful lines through.
            grep -E "^(FAIL|ERROR):|^[A-Za-z]+Error:|Traceback|AssertionError" test-output.log \
              | head -n 20 \
              | while IFS= read -r line; do
                  escaped=$(echo "$line" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
                  echo "::error::${escaped}"
                done
          fi
          exit $exit_code

      - name: Real launcher — POSIX (run.sh)
        if: runner.os != 'Windows'
        run: |
          chmod +x scripts/run.sh
          export SECONDMIND_VAULT="$(mktemp -d)"
          export SECONDMIND_INDEX_DB="$(mktemp -d)/index.db"
          ./scripts/run.sh put --type core --title "CI launcher check" --body "run.sh on ${{ matrix.os }}"
          ./scripts/run.sh search "launcher"
        shell: bash

      - name: Real launcher — cmd.exe (run.bat)
        if: runner.os == 'Windows'
        run: |
          set SECONDMIND_VAULT=%RUNNER_TEMP%\vault-bat
          set SECONDMIND_INDEX_DB=%RUNNER_TEMP%\index-bat.db
          rem 'call' is required: invoking a .bat file without it transfers
          rem control into that file permanently, so its own "exit /b"
          rem would terminate this whole step instead of returning control
          rem here to run the next line -- confirmed via a real
          rem windows-latest run where the second command below silently
          rem never executed for this exact reason.
          call scripts\run.bat put --type core --title "CI launcher check" --body "run.bat on windows-latest"
          call scripts\run.bat search "launcher" > search-output.txt
          type search-output.txt
          findstr /c:"CI launcher check" search-output.txt >nul
          if %ERRORLEVEL% NEQ 0 (
            echo ::error::run.bat search did not find the note run.bat put just wrote
            exit /b 1
          )
        shell: cmd

      - name: Real launcher — PowerShell (run.ps1)
        if: runner.os == 'Windows'
        run: |
          $env:SECONDMIND_VAULT = Join-Path $env:RUNNER_TEMP "vault-ps1"
          $env:SECONDMIND_INDEX_DB = Join-Path $env:RUNNER_TEMP "index-ps1.db"
          ./scripts/run.ps1 put --type core --title "CI launcher check" --body "run.ps1 on windows-latest"
          ./scripts/run.ps1 search "launcher"
        shell: pwsh

      - name: Live probe — real subprocess, real stdio JSON-RPC
        run: python scripts/live_probe.py

      - uses: astral-sh/setup-uv@v7

      - name: diagnose.py reports every check PASS on a correctly set-up machine
        run: python diagnose.py
        working-directory: scripts

      # diagnose.py itself needs Python to already exist to run at all --
      # it can never diagnose "Python is completely missing" from inside
      # itself. diagnose.bat/.ps1 are plain batch/PowerShell, no Python
      # required to run them, and their only job is answering that one
      # question first before handing off to diagnose.py.
      - name: diagnose.bat runs cleanly (Windows)
        if: runner.os == 'Windows'
        run: scripts\diagnose.bat
        shell: cmd

      - name: diagnose.ps1 runs cleanly (Windows)
        if: runner.os == 'Windows'
        run: ./scripts/diagnose.ps1
        shell: pwsh

      - name: Test-vault wrapper — POSIX (with_test_vault.sh)
        if: runner.os != 'Windows'
        run: |
          chmod +x scripts/with_test_vault.sh
          ./scripts/with_test_vault.sh ci-wrapper-check -m secondmind put --type core --title "wrapper check" --body "with_test_vault.sh on ${{ matrix.os }}"
          ./scripts/with_test_vault.sh ci-wrapper-check -m secondmind search "wrapper"
          # Rejects a path-like profile before ever touching uv/the filesystem.
          if ./scripts/with_test_vault.sh "../evil" -m secondmind search "x"; then
            echo "expected with_test_vault.sh to reject a path-like profile" >&2
            exit 1
          fi
        shell: bash

      - name: Test-vault wrapper — cmd.exe (with_test_vault.bat)
        if: runner.os == 'Windows'
        run: |
          rem 'call' required -- see the run.bat step above for why a bare
          rem invocation would silently skip the search verification.
          call scripts\with_test_vault.bat ci-wrapper-check -m secondmind put --type core --title "wrapper check" --body "with_test_vault.bat on windows-latest"
          call scripts\with_test_vault.bat ci-wrapper-check -m secondmind search "wrapper" > search-output-wtv.txt
          type search-output-wtv.txt
          findstr /c:"wrapper check" search-output-wtv.txt >nul
          if %ERRORLEVEL% NEQ 0 (
            echo ::error::with_test_vault.bat search did not find the note put just wrote
            exit /b 1
          )
        shell: cmd

      - name: Test-vault wrapper — PowerShell (with_test_vault.ps1)
        if: runner.os == 'Windows'
        run: |
          ./scripts/with_test_vault.ps1 ci-wrapper-check -m secondmind put --type core --title "wrapper check" --body "with_test_vault.ps1 on windows-latest"
          $result = ./scripts/with_test_vault.ps1 ci-wrapper-check -m secondmind search "wrapper"
          Write-Output $result
          if ($result -notmatch "wrapper check") {
            Write-Error "with_test_vault.ps1 search did not find the note put just wrote"
            exit 1
          }
        shell: pwsh

  claude-desktop-extension:
    name: claude-desktop-extension launcher (${{ matrix.os }})
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pre-warms the uv venv in its own step so first-run install noise
      # doesn't obscure the actual handshake output below.
      - name: Pre-warm uv venv
        run: uv run --directory . --extra mcp -m secondmind --help

      # SECONDMIND_REPO_DIR must be set explicitly here, pointing at a copy
      # of the extension folder OUTSIDE the checked-out repo -- this is
      # what actually reproduces the real failure mode (Claude Desktop
      # copies claude-desktop-extension/ into its own private storage on
      # install, so the launcher can no longer find the repo by looking at
      # its own location). Running the launcher from inside the repo
      # checkout would never have caught this bug in the first place.
      - name: Real MCP handshake over stdio — run.sh (POSIX), launcher copied elsewhere
        if: runner.os != 'Windows'
        run: |
          COPY_DIR="$(mktemp -d)/copied-extension"
          cp -r claude-desktop-extension "$COPY_DIR"
          chmod +x "$COPY_DIR/run.sh"
          export SECONDMIND_REPO_DIR="$GITHUB_WORKSPACE"
          export SECONDMIND_VAULT="$(mktemp -d)/vault"
          export SECONDMIND_INDEX_DB="$(mktemp -d)/index.db"
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2026-07-28","capabilities":{},"clientInfo":{"name":"ci","version":"1.0"}}}' \
            | "$COPY_DIR/run.sh" > response.json
          cat response.json
          grep -q '"result"' response.json
        shell: bash

      - name: run.sh rejects a missing SECONDMIND_REPO_DIR cleanly (POSIX)
        if: runner.os != 'Windows'
        run: |
          set +e
          output=$(echo '{}' | claude-desktop-extension/run.sh 2>&1)
          exit_code=$?
          echo "$output"
          if [ $exit_code -eq 0 ]; then
            echo "::error::run.sh should have failed without SECONDMIND_REPO_DIR set"
            exit 1
          fi
          echo "$output" | grep -q "SECONDMIND_REPO_DIR is not set"
        shell: bash

      # Real bug found and fixed via a scratch-branch investigation on a
      # real windows-latest runner: run.bat previously hardcoded "python3"
      # inside every "uv run ... python3 -m secondmind_mcp.server" call,
      # but uv's Windows venvs only ever create python.exe -- python3.exe
      # is a macOS/Linux-only alias. This step is what catches a
      # regression of that exact bug, since the earlier launcher checks
      # above never exercised claude-desktop-extension/ at all.
      # SECONDMIND_REPO_DIR must point at a copy of the extension folder
      # OUTSIDE the checked-out repo -- this reproduces the real failure
      # mode (Claude Desktop copies claude-desktop-extension\ into its
      # own private storage on install, so the launcher can no longer
      # find the repo by looking at its own location).
      - name: Real MCP handshake over stdio — run.bat (Windows), launcher copied elsewhere
        if: runner.os == 'Windows'
        run: |
          mkdir "%RUNNER_TEMP%\copied-extension"
          xcopy /e /i /y claude-desktop-extension "%RUNNER_TEMP%\copied-extension"
          set SECONDMIND_REPO_DIR=%GITHUB_WORKSPACE%
          set SECONDMIND_VAULT=%RUNNER_TEMP%\vault-ext
          set SECONDMIND_INDEX_DB=%RUNNER_TEMP%\index-ext.db
          echo {"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2026-07-28","capabilities":{},"clientInfo":{"name":"ci","version":"1.0"}}} > request.jsonl
          call "%RUNNER_TEMP%\copied-extension\run.bat" < request.jsonl > response.json
          type response.json
          findstr /c:"\"result\"" response.json >nul
          if %ERRORLEVEL% NEQ 0 (
            echo ::error::no JSON-RPC result in claude-desktop-extension\run.bat's response
            exit /b 1
          )
        shell: cmd

      - name: run.bat rejects a missing SECONDMIND_REPO_DIR cleanly (Windows)
        if: runner.os == 'Windows'
        run: |
          set SECONDMIND_REPO_DIR=
          call claude-desktop-extension\run.bat < nul > repo-dir-missing.txt 2>&1
          set RESULT=%ERRORLEVEL%
          type repo-dir-missing.txt
          if %RESULT% EQU 0 (
            echo ::error::run.bat should have failed without SECONDMIND_REPO_DIR set
            exit /b 1
          )
          findstr /c:"SECONDMIND_REPO_DIR is not set" repo-dir-missing.txt >nul
          if %ERRORLEVEL% NEQ 0 (
            echo ::error::expected a clear "SECONDMIND_REPO_DIR is not set" message
            exit /b 1
          )
        shell: cmd

      - name: uv-not-found path fails cleanly, not with a crash (Windows)
        if: runner.os == 'Windows'
        run: |
          set SECONDMIND_REPO_DIR=%GITHUB_WORKSPACE%
          set PATH=C:\Windows\System32
          set USERPROFILE=%RUNNER_TEMP%\fake-home-no-uv
          call claude-desktop-extension\run.bat < nul > fallback.txt 2>&1
          set RESULT=%ERRORLEVEL%
          type fallback.txt
          if %RESULT% NEQ 127 (
            echo ::error::expected exit code 127 when uv is unreachable, got %RESULT%
            exit /b 1
          )
          findstr /c:"no 'uv' executable found" fallback.txt >nul
          if %ERRORLEVEL% NEQ 0 (
            echo ::error::expected a clear "no uv executable found" message
            exit /b 1
          )
        shell: cmd

  core-isolation:
    name: core runs with zero pip installs (mcp NOT present)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify core is isolated when mcp is NOT installed
        run: |
          python -m venv "${{ runner.temp }}/isolated-venv"
          python - <<'PYEOF'
          import re, subprocess, sys, os

          venv_python = os.path.join(os.environ["RUNNER_TEMP"], "isolated-venv",
                                      "Scripts" if sys.platform == "win32" else "bin",
                                      "python.exe" if sys.platform == "win32" else "python")
          result = subprocess.run(
              [venv_python, "-m", "unittest", "discover", "-s", "tests", "-v"],
              capture_output=True, text=True,
          )
          output = result.stdout + result.stderr

          # At least one test file must fail to import BECAUSE mcp (or a
          # transitive dependency it pulls in, like starlette) is absent
          # — that's the proof mcp is genuinely uninstalled, not merely
          # skipped. Rather than hardcode how many files that should be
          # (which broke the moment a second mcp-dependent test file
          # existed — test_http_transport.py imports starlette
          # transitively via secondmind_mcp.http_transport, without
          # writing "import mcp" itself, so a text-based file count is
          # also unreliable), every ERROR block's traceback must cite a
          # ModuleNotFoundError for mcp/starlette/uvicorn — never anything
          # else, which is what actually proves the core has no hidden
          # dependency on any of them.
          error_blocks = re.split(r"\n(?=ERROR: )", output)[1:]
          assert error_blocks, f"expected at least one import ERROR with mcp absent, got:\n{output}"
          for block in error_blocks:
              assert re.search(r"No module named '(mcp|starlette|uvicorn)'", block), (
                  f"an ERROR block was not a missing-mcp-dependency import failure:\n{block}"
              )
          print(f"Confirmed: mcp absence only breaks {len(error_blocks)} mcp-dependent test file(s) via ModuleNotFoundError — core is isolated.")
          PYEOF
