name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run core test suite (stdlib unittest, zero installs)
        run: python -m unittest discover -s tests -v

      - name: Real launcher — POSIX (run.sh)
        if: runner.os != 'Windows'
        run: |
          chmod +x scripts/run.sh
          export SECONDMIND_VAULT="$(mktemp -d)"
          export SECONDMIND_INDEX_DB="$(mktemp -d)/index.db"
          ./scripts/run.sh put --type core --title "CI launcher check" --body "run.sh on ${{ matrix.os }}"
          ./scripts/run.sh search "launcher"
        shell: bash

      - name: Real launcher — cmd.exe (run.bat)
        if: runner.os == 'Windows'
        run: |
          set SECONDMIND_VAULT=%RUNNER_TEMP%\vault-bat
          set SECONDMIND_INDEX_DB=%RUNNER_TEMP%\index-bat.db
          scripts\run.bat put --type core --title "CI launcher check" --body "run.bat on windows-latest"
          scripts\run.bat search "launcher"
        shell: cmd

      - name: Real launcher — PowerShell (run.ps1)
        if: runner.os == 'Windows'
        run: |
          $env:SECONDMIND_VAULT = Join-Path $env:RUNNER_TEMP "vault-ps1"
          $env:SECONDMIND_INDEX_DB = Join-Path $env:RUNNER_TEMP "index-ps1.db"
          ./scripts/run.ps1 put --type core --title "CI launcher check" --body "run.ps1 on windows-latest"
          ./scripts/run.ps1 search "launcher"
        shell: pwsh

      - name: Install mcp SDK extra for the adapter/probe tests
        run: python -m pip install -e ".[mcp]"

      - name: MCP adapter test suite (requires mcp installed)
        run: python -m unittest tests.test_mcp_adapter -v

      - name: Live probe — real subprocess, real stdio JSON-RPC
        run: python scripts/live_probe.py

  core-isolation:
    name: core runs with zero pip installs (mcp NOT present)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify core is isolated when mcp is NOT installed
        run: |
          python -m venv "${{ runner.temp }}/isolated-venv"
          python - <<'PYEOF'
          import subprocess, sys, os

          venv_python = os.path.join(os.environ["RUNNER_TEMP"], "isolated-venv",
                                      "Scripts" if sys.platform == "win32" else "bin",
                                      "python.exe" if sys.platform == "win32" else "python")
          result = subprocess.run(
              [venv_python, "-m", "unittest", "discover", "-s", "tests", "-v"],
              capture_output=True, text=True,
          )
          output = result.stdout + result.stderr

          # test_mcp_adapter.py itself imports mcp, so it MUST fail to import
          # in this venv — that failure is the proof mcp is genuinely absent,
          # not skipped. Every other test file must still pass (Ran N tests,
          # exactly 1 error), proving the core has no hidden dependency on mcp.
          assert "No module named 'mcp'" in output, (
              "expected test_mcp_adapter's import to fail with mcp absent, got:\n" + output
          )
          assert output.count("ERROR:") == 1, (
              "expected exactly 1 import error (test_mcp_adapter), got:\n" + output
          )
          print("Confirmed: mcp absence only breaks the mcp-dependent test file — core is isolated.")
          PYEOF
